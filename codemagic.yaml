scripts:
      - name: Recreate Android platform configuration (Fix v1 embedding)
        script: |
          # 1. Clear out the legacy embedding files
          rm -rf android
          
          # 2. Re-generate a fresh, modern v2-compliant Android configuration
          flutter create --platforms=android .
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          
          # 3. Inject the production internet permission required for your Bybit API connection
          sed -i '' 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>|g' android/app/src/main/AndroidManifest.xml
          
      - name: Clean previous builds
        script: |
          flutter clean
      - name: Fetch project package dependencies
        script: |
          flutter pub get
