workflows:
  saad-bot-pipeline:
    name: Saad Trading Bot Production Engine Build
    instance_type: mac_mini_m1
    max_build_duration: 75
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Create local config components for Android mapping
        script: |
          mkdir -p android
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
      - name: Clean previous builds
        script: |
          flutter clean
      - name: Fetch project package dependencies
        script: |
          flutter pub get
      - name: Run code validation checks and linter analysis
        script: |
          flutter analyze --no-fatal-infos
      - name: Run Flutter validation tests
        script: |
          flutter test
      - name: Install iOS pods (if needed)
        script: |
          cd ios && pod install && cd ..
      - name: Build Android Release APK (split per ABI)
        script: |
          flutter build apk --release --split-per-abi
      - name: Build Android Production App Bundle (AAB)
        script: |
          flutter build appbundle --release
      - name: Build iOS Unsigned Device Package Bundle
        script: |
          flutter build ios --release --no-codesign --verbose
    artifacts:
      - 'build/app/outputs/apk/release/*.apk'
      - 'build/app/outputs/bundle/release/*.aab'
      - 'build/ios/iphoneos/*.app'
